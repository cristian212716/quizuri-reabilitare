igatorie a oricărui simptom"}, {"letter": "e", "text": "Dependența totală de echipa medicală"}], "answers": ["b"], "repeat": false}, {"original": 26, "question": "Ce dimensiuni reunește modelul biopsihosocial?", "options": [{"letter": "a", "text": "Biologică, psihologică și socială"}, {"letter": "b", "text": "Doar farmacologică"}, {"letter": "c", "text": "Exclusiv familială"}, {"letter": "d", "text": "Doar biologică și [inanciară"}, {"letter": "e", "text": "Doar juridică și administrativă"}], "answers": ["a"], "repeat": true}, {"original": 38, "question": "Ce principiu reblectă comunicarea dintre doi experți?", "options": [{"letter": "a", "text": "Excluderea opiniei pacientului"}, {"letter": "b", "text": "Controlul unilateral"}, {"letter": "c", "text": "Parteneriatul dintre profesionist și bene[iciar"}, {"letter": "d", "text": "Impunerea automată a soluțiilor"}, {"letter": "e", "text": "Lipsa consimțământului"}], "answers": ["c"], "repeat": false}, {"original": 17, "question": "Ce rol are exercițiul bizic în reabilitarea medicală?", "options": [{"letter": "a", "text": "Are scop exclusiv diagnostic"}, {"letter": "b", "text": "Elimină necesitatea planificării"}, {"letter": "c", "text": "Intervenție complementară pentru funcționare și sănătate"}, {"letter": "d", "text": "Înlocuiește universal medicația"}, {"letter": "e", "text": "Este contraindicată în toate tulburările"}], "answers": ["c"], "repeat": true}];const multi=false;let pos=0;let selected=items.map(()=>[]);let checked=items.map(()=>false);
const panel=document.getElementById('panel');function eq(a,b){return a.length===b.length&&a.every(x=>b.includes(x))}function score(){return items.reduce((n,q,i)=>n+(checked[i]&&eq(selected[i],q.answers)?1:0),0)}
function render(){document.getElementById('counter').textContent=pos<items.length?'Întrebarea '+(pos+1)+' din '+items.length:'Rezultatul final';document.getElementById('points').textContent='Corecte verificate: '+score();document.getElementById('fill').style.width=(100*Math.min(pos+1,items.length)/items.length)+'%';panel.innerHTML='';if(pos===items.length){summary();return}const q=items[pos];const h=document.createElement('h1');h.textContent=q.question;panel.appendChild(h);const hint=document.createElement('div');hint.className='hint';hint.textContent=multi?'Selectează toate răspunsurile pe care le consideri corecte.':'Selectează un singur răspuns.';panel.appendChild(hint);q.options.forEach(o=>{const lab=document.createElement('label');lab.className='option';const inp=document.createElement('input');inp.type=multi?'checkbox':'radio';inp.name='answer';inp.value=o.letter;inp.checked=selected[pos].includes(o.letter);inp.disabled=checked[pos];if(checked[pos]){if(q.answers.includes(o.letter))lab.classList.add('correct');else if(selected[pos].includes(o.letter))lab.classList.add('wrong')}inp.addEventListener('change',()=>{if(multi){selected[pos]=[...panel.querySelectorAll('input:checked')].map(e=>e.value)}else{selected[pos]=[o.letter]}render()});const sp=document.createElement('span');sp.textContent=o.letter+') '+o.text;lab.append(inp,sp);panel.appendChild(lab)});const fb=document.createElement('div');fb.className='feedback';if(checked[pos]){const good=eq(selected[pos],q.answers);fb.style.display='block';fb.classList.add(good?'ok':'bad');fb.textContent=(good?'✓ Corect!':'✕ Incorect.')+' '+(multi?'Răspunsurile corecte sunt: ':'Răspunsul corect este: ')+q.answers.map(a=>{let o=q.options.find(o=>o.letter===a);return o?o.letter+') '+o.text:a}).join(' · ')}panel.appendChild(fb);const actions=document.createElement('div');actions.className='actions';const prev=document.createElement('button');prev.className='secondary';prev.textContent='← Înapoi';prev.disabled=pos===0;prev.onclick=()=>{pos--;render()};actions.appendChild(prev);const space=document.createElement('div');space.className='spacer';actions.appendChild(space);if(!checked[pos]){const check=document.createElement('button');check.textContent='Check answer';check.disabled=selected[pos].length===0;check.onclick=()=>{checked[pos]=true;render()};actions.appendChild(check)}else{const next=document.createElement('button');next.textContent=pos===items.length-1?'Vezi rezultatul':'Următoarea →';next.onclick=()=>{pos++;render()};actions.appendChild(next)}panel.appendChild(actions)}
function summary(){const h=document.createElement('div');h.className='summary';h.innerHTML='<h1>Quiz finalizat!</h1><div class="big">'+score()+' / '+items.length+'</div><p>Ai obținut '+Math.round(score()*100/items.length)+'% răspunsuri corecte.</p>';const again=document.createElement('button');again.textContent='Reia quizul';again.onclick=()=>{pos=0;selected=items.map(()=>[]);checked=items.map(()=>false);render()};h.appendChild(again);const review=document.createElement('div');review.className='review';items.forEach((q,i)=>{const d=document.createElement('div');d.textContent=(eq(selected[i],q.answers)?'✓ ':'✕ ')+(i+1)+'. '+q.question;review.appendChild(d)});h.appendChild(review);panel.appendChild(h)}render();</script></body></html>
